name: ping-buscadores
on:
  push:
    branches: [master]
    paths:
      - "index.html"
      - "sitemap.xml"
      - "blog/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Leer clave IndexNow
        id: key
        run: |
          KEY=$(ls *.txt | head -1 | sed 's/\.txt$//')
          echo "key=$KEY" >> $GITHUB_OUTPUT
      - name: Avisar a Bing/Yandex/Seznam/Naver
        run: |
          KEY="${{ steps.key.outputs.key }}"
          URLS=$(printf 'https://graphicsosa-web.vercel.app/%s' \
            "" "blog/" "blog/errores-menu-restaurante.html" "blog/logo-clinicas-consultorios.html" \
            "blog/cuanto-cuesta-logo.html" "blog/frases-peliculas.html" \
            "blog/en/" "blog/en/errores-menu-restaurante.html" "blog/en/logo-clinicas-consultorios.html" \
            "blog/en/cuanto-cuesta-logo.html" "blog/en/frases-peliculas.html" \
            | sed 's|https://graphicsosa-web.vercel.app/$|https://graphicsosa-web.vercel.app/|' \
            | awk '{printf "%s\"%s\"", (NR>1?",":""), $0}')
          curl -s -o /dev/null -w "%{http_code}\n" -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{\"host\":\"graphicsosa-web.vercel.app\",\"key\":\"$KEY\",\"keyLocation\":\"https://graphicsosa-web.vercel.app/$KEY.txt\",\"urlList\":[$URLS]}"
      - name: Avisar a Google (sitemap)
        run: |
          curl -s -o /dev/null -w "%{http_code}\n" "https://www.google.com/ping?sitemap=https://graphicsosa-web.vercel.app/sitemap.xml"
